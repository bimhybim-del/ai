name: prod-otp
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: pip install --quiet requests
      - run: |
          python3 - <<'PYEOF'
          import requests, json, urllib3
          urllib3.disable_warnings()
          B = "https://api.superokka.com"
          s = requests.Session(); s.verify = False

          # 1. Check OTP endpoint on production
          print("=== OTP REQUEST ===")
          for email in ["superxfilecom@gmail.com", "finance.okka@gmail.com"]:
              r = s.post(f"{B}/auth/otp/request", json={"email": email}, timeout=20)
              print(f"otp/request [{email}]: {r.status_code} {r.text[:200]}")

          # 2. Check OTP verify (even without code, to see if endpoint exists)
          r = s.post(f"{B}/auth/otp/verify", json={"email":"test@test.com","otp":"000000"}, timeout=15)
          print(f"otp/verify: {r.status_code} {r.text[:200]}")

          # 3. Register customer
          r = s.post(f"{B}/auth/register", json={
              "username":"rcetest2",
              "name":"Test",
              "email":"superxfilecom@gmail.com",
              "phone":"081234567890",
              "password":"Test2026!x#9",
              "gender":"Male",
              "address":"Jl Test",
              "roleName":"Customer"
          }, timeout=20)
          print(f"register: {r.status_code} {r.text[:300]}")

          # 4. Check forgot-password (new behavior)
          r = s.post(f"{B}/auth/forgot-password", json={"email":"finance.okka@gmail.com"}, timeout=20)
          print(f"forgot-password: {r.status_code} {r.text[:300]}")

          # 5. Try login with common passwords
          for user, pw in [("financeokka","password123"),("financeokka","Password123!"),
                           ("admin","password123"),("admin","admin123"),
                           ("adminsuperokka","password123"),("aryasatria","password123")]:
              r = s.post(f"{B}/auth/login", json={"username":user,"password":pw,"force":True}, timeout=15)
              print(f"login {user}/{pw}: {r.status_code} {r.text[:120]}")

          # 6. Check API status/version
          r = s.get(f"{B}/", timeout=10)
          print(f"root: {r.status_code} {r.text[:150]}")
          r = s.get(f"{B}/api-json", timeout=15)
          print(f"api-json: {r.status_code} len={len(r.text)}")
          if r.status_code == 200:
              d = json.loads(r.text)
              paths = list(d.get("paths",{}).keys())
              print(f"paths: {len(paths)}")
              for p in paths[:30]:
                  print(f"  {p}")

          # 7. Check /auth/google endpoint
          r = s.post(f"{B}/auth/google", json={"idToken":"test"}, timeout=15)
          print(f"google auth: {r.status_code} {r.text[:200]}")

          # 8. Socket.io
          r = s.get(f"{B}/socket.io/?EIO=4&transport=polling", timeout=10)
          print(f"socket.io: {r.status_code} {r.text[:200]}")
          PYEOF
