name: probe
on:
  push:
    paths:
      - 'probe.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        run: python3 probe.py > result.txt 2>&1 || true
      - name: Upload result via API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYEOF'
          import base64, pathlib, os, urllib.request, json
          content = pathlib.Path('result.txt').read_bytes()
          b64 = base64.b64encode(content).decode()
          token = os.environ["GITHUB_TOKEN"]
          # cek sha file existing
          sha = None
          try:
              req0 = urllib.request.Request(
                  "https://api.github.com/repos/bimhybim-del/ai/contents/result.txt",
                  headers={"Authorization": "Bearer " + token, "X-GitHub-Api-Version": "2022-11-28"})
              data0 = json.loads(urllib.request.urlopen(req0, timeout=20).read().decode())
              sha = data0.get("sha")
              print("existing sha:", sha)
          except urllib.error.HTTPError as e:
              print("no existing file:", e.code)
          payload = {"message": "probe result", "content": b64}
          if sha:
              payload["sha"] = sha
          req = urllib.request.Request(
              "https://api.github.com/repos/bimhybim-del/ai/contents/result.txt",
              data=json.dumps(payload).encode(), method="PUT",
              headers={"Authorization": "Bearer " + token,
                       "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28"})
          try:
              resp = urllib.request.urlopen(req, timeout=30)
              print("upload:", resp.status)
          except urllib.error.HTTPError as e:
              print("upload err:", e.code, e.read()[:200])
          PYEOF
