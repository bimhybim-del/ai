name: probe
on:
  push:
    paths:
      - 'probe.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        run: python3 probe.py > result.txt 2>&1 || true
      - name: Upload result via API
        run: |
          python3 - <<'PYEOF'
          import base64, pathlib, os, urllib.request, json
          content = pathlib.Path('result.txt').read_bytes()
          b64 = base64.b64encode(content).decode()
          payload = json.dumps({"message": "probe result", "content": b64}).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/bimhybim-del/ai/contents/result.txt",
              data=payload, method="PUT",
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                       "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28"})
          try:
              resp = urllib.request.urlopen(req, timeout=30)
              print("upload:", resp.status)
          except urllib.error.HTTPError as e:
              print("upload err:", e.code, e.read()[:200])
          PYEOF
