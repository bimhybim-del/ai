name: superokka
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: pip install --quiet requests pypdf
      - run: |
          python3 - <<'PYEOF'
          import requests, json, urllib3, itertools
          urllib3.disable_warnings()
          B = "https://api.superokka.com"
          s = requests.Session(); s.verify = False
          r = s.post(f"{B}/auth/login", json={"username":"financeokka","password":"KwRce2026!x#9","force":True}, timeout=25)
          print("LOGIN:", r.status_code)
          if not r.json().get("success"): print(r.text[:120]); raise SystemExit
          A = {"Authorization": "Bearer " + r.json()["data"]["accessToken"]}
          body = {"departureAirportCode":"CGK","arrivalAirportCode":"SUB","departureDate":"2026-12-22"}
          r = s.post(f"{B}/flight-search/lion-air/search", headers=A, json=body, timeout=60)
          d = r.json().get("data", {})
          sid = d.get("sessionId")
          segs = (d.get("departureFlightsData") or [{}])[0].get("flightSegments", [])
          print("SEARCH:", r.status_code, "segs:", len(segs))
          if not sid or not segs: raise SystemExit
          seg = segs[0]
          bks = seg.get("bookingAvails", [])
          print("BOOKING AVAILS:", json.dumps(bks)[:200])
          variants = []
          for bk in bks:
              for addons, ins in [(None, False), ([], False), ([], True), (None, True)]:
                  variants.append((bk, addons, ins))
          results = []
          for idx,(bk, addons, ins) in enumerate(variants[:8]):
              det = {"flightSegments":[{"departureAirportCode":seg["departureAirport"],"arrivalAirportCode":seg["arrivalAirport"],
                     "departureDate":seg["departureDateTime"],"arrivalDate":seg["arrivalDateTime"],
                     "flightNumber":seg["flightNumber"],"airlineCode":seg["airline"]["code"],
                     "resBookDesigCode":bk["bookingClass"],"type":"departure"}],
                     "adults":1,"children":0,"infants":0,"direction":"one-way","sessionId":sid}
              s.post(f"{B}/flight-search/lion-air/details", headers=A, json=det, timeout=60)
              traveler = {"passengerTypeCode":"ADT","isAccompaniedByInfant":False,"prefixName":"MR",
                  "firstName":"Budi","lastName":"Santoso","surname":"Santoso",
                  "dateOfBirth":"1990-01-01","gender":"M","nationality":"ID","documentType":"KTP",
                  "documentNumber":"3174010101900001","documentExpirationDate":"2028-01-01","documentIssueCountry":"ID",
                  "email":"superxfilecom@gmail.com","phoneNumber":"081234567890"}
              book = {"airTravelers":[traveler],"addOns":addons,"isUsingInsurance":ins,"sessionId":sid,
                      "contactEmail":"superxfilecom@gmail.com","contactPhoneNumber":"081234567890",
                      "contactFirstName":"Budi","contactLastName":"Santoso","isEndOfTransaction":True}
              rr = s.post(f"{B}/flight-search/lion-air/book", headers=A, json=book, timeout=120)
              print(f"VAR{idx} class={bk['bookingClass']} addOns={addons} ins={ins} → {rr.status_code} {rr.text[:140]}")
              if rr.json().get("success"):
                  tx = rr.json()["data"]
                  tid = tx.get("transactionId") or tx.get("id")
                  print("SUCCESS TID:", tid)
                  r2 = s.post(f"{B}/transactions/{tid}/etickets", headers=A, timeout=180)
                  print("ETICKET:", r2.status_code, r2.text[:150])
                  break
          PYEOF
