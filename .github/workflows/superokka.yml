name: superokka
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: pip install --quiet requests pypdf
      - run: |
          python3 - <<'PYEOF'
          import requests, json, urllib3
          urllib3.disable_warnings()
          B = "https://api.superokka.com"
          s = requests.Session(); s.verify = False
          r = s.post(f"{B}/auth/login", json={"username":"financeokka","password":"KwRce2026!x#9","force":True}, timeout=25)
          print("LOGIN:", r.status_code)
          A = {"Authorization": "Bearer " + r.json()["data"]["accessToken"]}
          # 1) latest transactions (did failed book create one?)
          r = s.get(f"{B}/transactions?limit=5", headers=A, timeout=20)
          for t in r.json().get("data", []):
              print("TX:", t.get("id","")[:8], t.get("code"), t.get("type"), t.get("transactionStatus"))
          # 2) quota reserve attempts
          for pl in [ {"umrahPackageId":"2d79b57a-806d-4269-a889-b68313158a82","qty":1},
                      {"packageId":"2d79b57a-806d-4269-a889-b68313158a82","qty":1},
                      {} ]:
              rr = s.post(f"{B}/quota/reserve", headers=A, json=pl, timeout=25)
              print("QUOTA RESERVE", str(pl)[:50], "→", rr.status_code, rr.text[:150])
          # 3) transaction create variants as admin
          for pl in [ {"airlineId":"4792ce0e-6a29-491e-8a99-df09c34e70c0","qty":1,"type":"airlines"},
                      {"type":"airlines","qty":1},
                      {"packageId":"2d79b57a-806d-4269-a889-b68313158a82","qty":1,"airlineId":"4792ce0e-6a29-491e-8a99-df09c34e70c0"} ]:
              rr = s.post(f"{B}/transactions", headers=A, json=pl, timeout=25)
              print("TX CREATE", str(pl)[:60], "→", rr.status_code, rr.text[:130])
          # 4) export variants
          for q in ["?format=pdf","?type=pdf","?format=xlsx","?type=xlsx","?exportType=pdf"]:
              rr = s.get(f"{B}/transactions/export{q}", headers=A, timeout=40)
              print("EXPORT", q, "→", rr.status_code, rr.headers.get("Content-Type","")[:24], rr.text[:80])
          # 5) eticket with more field probes on airlines tx
          for pl in [ {"passengerName":"ZZTESTZZ"}, {"contactName":"ZZTESTZZ"}, {"language":"en"} ]:
              rr = s.post(f"{B}/transactions/2e029cbf-9912-424d-94e1-f3282adacda1/etickets", headers=A, json=pl, timeout=180)
              print("AIR ET", str(pl), "→", rr.status_code, rr.text[:130])
          PYEOF
